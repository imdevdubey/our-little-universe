<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Between the 11 & 12 ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

    <div id="intro">

        <div class="stars"></div>

        <div class="moon"></div>

        <div class="intro-text">

            <h2 id="line1">
                Someone made this with all his heart...
            </h2>

            <h2 id="line2">
                For the girl who turned ordinary days into my favorite memories.
            </h2>

            <div id="mainTitle">

                <h1>
                    Happy National Girlfriend Day
                </h1>

                <h3>
                    Khushu ❤️
                </h3>

                <button id="openButton">
                    ❤️ Open My Heart
                </button>

            </div>

        </div>

    </div>
<!-- PASSWORD SECTION -->

<div id="passwordPage">

    <div class="lock">
        🔒
    </div>

    <h2>
        One question before I open your heart...
    </h2>

    <p>
        What nickname do I call you?
    </p>


    <input 
    type="password" 
    id="passwordInput"
    placeholder="Enter here ❤️">


    <button id="unlockButton">
        ❤️ Unlock My Heart
    </button>


    <p id="passwordMessage"></p>


</div>
    
    <script src="script.js"></script>

</body>

</html>
